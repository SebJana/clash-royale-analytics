server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri /index.html;
    }

    # Proxy all /api to backend container
    location /api/ {
        proxy_pass http://api:8000/api/;

        # Use the connecting peer; discard any client-supplied forwarding chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
    }

    # Publish FastAPI's documentation without exposing the API container directly.
    # Remove or protect this location if Swagger should not be public.
    location ~ ^/(docs(?:/|$)|redoc(?:/|$)|openapi\.json$) {
        proxy_pass http://api:8000;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }
}
